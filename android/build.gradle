buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.24"
        // Tells react-native-svg (and other libs that use the same pattern)
        // where react-native lives without spawning a `node` process during
        // Gradle configuration.  Node via nvm is not in Gradle's PATH so the
        // fallback exec("node …") fails.  rootDir is the android/ folder.
        REACT_NATIVE_NODE_MODULES_DIR = new File(rootDir, "../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Block snapshot repos from being used for project dependencies
// (sonatype snapshots are unreliable in field environments)
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.emoji2:emoji2:1.3.0'
            force 'androidx.emoji2:emoji2-collections:1.3.0'
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
